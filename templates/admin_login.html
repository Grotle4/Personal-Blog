<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
</head>
<body>
    <form action="/loginsubmit" method="POST" class="login-grid">
        <h1>Login</h1>
        <div class="login_row">
            <input type="text" value="{{entered_username}}" placeholder= "Enter Username" name="username_input" id="username">
            <p id="user_error" style="{{ username_error_style }}">Username is Incorrect</p>
        </div>
        <div class="login_row">
            <input type="password" value="{{entered_password}}" placeholder="Enter Password" name="password_input" id="password">
            <p id="pass_error" style="{{ password_error_style }}">Password Is Incorrect</p>
        </div>
        <input type="submit" value="Login" style="width: 90px; height: 30px";>
    </form>
    <form action="/return" class="top-right-absolute">
        <input type="submit" value="Back To Home" style="width: 120px; height: 30px;">
    </form>
</body>
</html>
